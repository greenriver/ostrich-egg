name: Python CI

# No paths: filter. Dependency and config changes break this package as readily as .py
# changes do, and a filtered-out PR reports no checks at all rather than a skip.
on:
  push:
    branches:
      - main
  pull_request:

# Read-only default so a job added without a permissions: block cannot inherit
# write-all.
permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint and test (py${{ matrix.python-version }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is what this has always been tested on. 3.13 is what the golden Airflow
        # image (github.com/greenriver/airflow) runs, and openpath-airflow installs this
        # package into it -- so a break there has to fail here rather than in that build.
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip" # caching pip dependencies
      - run: |
          pip install --upgrade pip
          pip install -r dependencies/requirements.txt
          pip install -r dependencies/requirements.test.txt
        name: "Install Dependencies"
      - name: "Lint with Flake8"
        run: flake8
      # --check matters. Without it black rewrites the files in place and exits 0, so
      # formatting was never actually gated -- the job passed on unformatted code.
      - name: "Format with Black"
        run: black --check --diff .
      - name: "Test with Pytest"
        run: pytest
